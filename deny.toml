[advisories]
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "Informational unmaintained notice for instant, inherited through GPUI Kit; the advisory offers no safe upgrade. Expires 2027-03-31." },
    { id = "RUSTSEC-2024-0436", reason = "Informational unmaintained notice for paste, inherited through GPUI Kit; the advisory offers no safe upgrade. Expires 2027-03-31." },
    { id = "RUSTSEC-2025-0134", reason = "Informational unmaintained notice for rustls-pemfile, inherited through GPUI Kit assets; the advisory offers no safe upgrade. Expires 2027-03-31." },
    { id = "RUSTSEC-2026-0192", reason = "Informational unmaintained notice for ttf-parser, required by GPUI's font and SVG stack; the advisory offers no safe upgrade. Expires 2027-03-31." },
    { id = "RUSTSEC-2026-0206", reason = "Informational unmaintained notice for rustybuzz, required by GPUI's SVG stack; the advisory offers no safe upgrade. Expires 2027-03-31." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # acl-sys is required by the approved posix-acl provider. LGPL-2.1-only is
    # compatible with Musheen's GPL-3.0-or-later distribution license.
    { allow = ["LGPL-2.1"], crate = "acl-sys" },
]
