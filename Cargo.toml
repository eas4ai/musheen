[package]
name = "musheen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[workspace]
members = [
    "crates/musheen-core",
    "crates/musheen-desktop",
    "crates/musheen-local",
    "crates/musheen-ops",
    "crates/musheen-test-support",
    "crates/musheen-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
camino = "1"
freedesktop = "0.0"
futures-lite = "2"
gpui-kit = "0.6.4"
native-theme = "0.5"
native-theme-gpui = { version = "0.5", default-features = false, features = ["svg-rasterize"] }
nix = { version = "0.31", features = ["fs"] }
notify = "8"
open = "5"
proc-mounts = "0.3"
reflink-copy = "0.1"
rustix = { version = "1", features = ["fs"] }
trybuild = "1"
tempfile = "3"
walkdir = "2"
wax = "0.7"
xattr = "1"

[dependencies]
musheen-desktop = { path = "crates/musheen-desktop" }
musheen-local = { path = "crates/musheen-local" }
musheen-ui = { path = "crates/musheen-ui" }

[lints]
workspace = true

[patch.crates-io]
native-theme-gpui = { path = "vendor/native-theme-gpui" }
