name: Release verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release matrix locally in Docker
        run: scripts/run-release-matrix.sh
        env:
          MUSHEEN_SCRATCH_BASE: ${{ runner.temp }}
      - name: Build native Arch package in Docker
        run: scripts/build-arch-package.sh
        env:
          MUSHEEN_SCRATCH_BASE: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: musheen-release
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/musheen-release-*/*
            ${{ runner.temp }}/musheen-arch-package-*/*.pkg.tar.zst
