name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  locked-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev
      - name: Build locked dependency tree
        run: cargo build --locked
