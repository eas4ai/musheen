Listen 8080
Listen 8443

DavLockDB /var/lock/apache2/DAVLock

<VirtualHost *:8080>
    DocumentRoot /srv/remote
    <Directory /srv/remote>
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8443>
    DocumentRoot /srv/remote
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/musheen-remote-ci.crt
    SSLCertificateKeyFile /etc/ssl/private/musheen-remote-ci.key

    <Directory /srv/remote>
        DAV On
        Options Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Musheen remote provider tests"
        AuthUserFile /etc/apache2/remote-ci.passwd
        Require valid-user
    </Directory>
</VirtualHost>
